<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gwadmin · 边缘网关管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>gwadmin</h1>
  <p>工厂边缘网关本地管理 Agent</p>
</header>
<main>
  <section class="card">
    <h2>设备状态 <button id="refresh">刷新</button></h2>
    <dl id="status">
      <dt>状态</dt><dd data-k="status">-</dd>
      <dt>版本</dt><dd data-k="version">-</dd>
      <dt>运行时长(s)</dt><dd data-k="uptime_seconds">-</dd>
      <dt>工作线程</dt><dd data-k="workers">-</dd>
      <dt>已处理请求</dt><dd data-k="requests_handled">-</dd>
    </dl>
  </section>
  <section class="card">
    <h2>配置</h2>
    <form id="config-form" method="post" action="/api/config">
      <label>采样间隔 (ms)
        <input name="sampling_interval_ms" type="number" min="10" max="3600000">
      </label>
      <label>告警阈值
        <input name="alarm_threshold" type="number" step="0.1" min="0" max="10000">
      </label>
      <label>设备名称
        <input name="device_name" type="text" maxlength="64">
      </label>
      <button type="submit">保存</button>
    </form>
    <pre id="config-view"></pre>
    <p id="message" role="status"></p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
