[metadata]
name = rex
version = 0.1.0
description = A mini regular-expression engine in pure Python (no third-party dependencies)
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = rex
python_requires = >=3.8

[options.entry_points]
console_scripts =
    rex-cli = rex.cli:main
