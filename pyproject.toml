[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniweb"
version = "0.1.0"
description = "A tiny HTTP/1.1 web server implemented with Python standard library sockets"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
miniweb = "miniweb.cli:main"

[tool.setuptools]
packages = ["miniweb"]
