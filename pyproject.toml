[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytpl"
version = "0.1.0"
description = "A mini template engine (variables, loops, conditionals, inheritance) using only the Python standard library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
tinytpl-cli = "tinytpl.cli:main"

[tool.setuptools.packages.find]
include = ["tinytpl*"]
