[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlq"
version = "0.1.0"
description = "A tiny in-memory SQL relational query engine, standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sqlq-cli = "sqlq.cli:main"

[tool.setuptools.packages.find]
include = ["sqlq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
