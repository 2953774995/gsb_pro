[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minidiff"
version = "0.1.0"
description = "A tiny from-scratch diff/patch tool using the Python standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "minidiff" }]
keywords = ["diff", "patch", "unified-diff", "lcs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
minidiff = "minidiff.cli:main"
minidiff-cli = "minidiff.cli:main"

[tool.setuptools.packages.find]
include = ["minidiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
