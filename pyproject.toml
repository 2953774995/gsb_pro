[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlq"
version = "0.1.0"
description = "A minimal in-memory SQL relational query engine (stdlib only)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
sqlq-cli = "sqlq.cli:main"

[tool.setuptools]
packages = ["sqlq"]
