[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rex"
version = "0.1.0"
description = "A tiny backtracking regular expression engine implemented from scratch, stdlib-only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "rex contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rex-cli = "rex.cli:main"

[tool.setuptools]
packages = ["rex"]

[tool.setuptools.package-dir]
rex = "rex"
