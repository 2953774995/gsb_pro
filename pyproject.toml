[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minipb"
version = "0.1.0"
description = "A mini Protocol Buffers: schema compiler + compact binary encoding, stdlib only"
requires-python = ">=3.8"

[project.scripts]
minipb = "minipb.cli:main"

[tool.setuptools]
packages = ["minipb"]
