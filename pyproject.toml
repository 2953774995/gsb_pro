[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minimq"
version = "0.1.0"
description = "A mini in-memory message queue with persistence (standard library only)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
minimq-cli = "minimq.cli:main"

[tool.setuptools.packages.find]
include = ["minimq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
